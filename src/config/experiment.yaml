api_extraction:
  header_dir: testdata/cJSON
  include_dirs:
    - testdata/cJSON
  extracted_api_json: data/extracted_api.json

prompt_generation:
  output_dir: data/seed_prompts
  samples: 2
  num_funcs: 5
  system_includes:
    - stdint.h
    - stddef.h
    - stdio.h
    - stdlib.h
    - string.h
    - cJSON.h
    - cJSON_Utils.h
  api_prefixes:
    - cJSON

feedback_iteration:
  output_dir: data/feedback_results
  samples_per_round: 2
  fuzz_timeout_sec: 20

validator:
  clang_path: clang
  include_dirs:
    - testdata/cJSON
  lib_dir: testdata/cJSON/build
  libs:
    - cjson
    - cjson_utils
