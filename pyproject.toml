[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
no_implicit_optional = false
