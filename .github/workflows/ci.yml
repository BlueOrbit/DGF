name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src tests

      - name: Mypy check
        run: mypy src

      - name: Import smoke
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import dgf_prompt_generator.llm_caller; import dgf_feedback.feedback_controller"

      - name: Pytest
        run: pytest
